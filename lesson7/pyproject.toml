[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-api"
version = "1.0.0"
description = "Lesson 7 Backend Service - Product & Order API with Flask, SQLAlchemy 2.x, Marshmallow, and Docker"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Migrate>=4.0.0",
    "SQLAlchemy>=2.0.0",
    "marshmallow>=3.20.0",
    "gunicorn>=21.2.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
