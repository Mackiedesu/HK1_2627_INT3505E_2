# OpenAPI 3.0 specification for Product & Order API
openapi: 3.0.3
info:
  title: Product & Order API
  version: 1.0.0
  description: Backend Service with Flask, SQLAlchemy 2.x, and Marshmallow
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: health.liveness
      responses:
        '200':
          description: Service process is alive
  /ready:
    get:
      summary: Readiness probe
      operationId: health.readiness
      responses:
        '200':
          description: Service dependencies (database) are ready
        '503':
          description: Service dependencies are degraded
  /api/v1/products:
    get:
      summary: List paginated non-archived products
      operationId: products.list_products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of products
    post:
      summary: Create a new product
      operationId: products.create_product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIn'
      responses:
        '201':
          description: Product created
        '409':
          description: Duplicate SKU conflict
        '422':
          description: Validation error
  /api/v1/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Retrieve a single non-archived product by ID
      operationId: products.get_product
      responses:
        '200':
          description: Product details
        '404':
          description: Product not found
    patch:
      summary: Partially update product fields
      operationId: products.patch_product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
      responses:
        '200':
          description: Updated product
        '404':
          description: Product not found
        '422':
          description: Validation error
    delete:
      summary: Soft-delete a product (mark archived=true)
      operationId: products.delete_product
      responses:
        '204':
          description: Product archived
        '404':
          description: Product not found
  /api/v1/products/{id}/reserve:
    post:
      summary: Reserve stock for a product
      operationId: products.reserve_product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveIn'
      responses:
        '200':
          description: Stock reserved
        '404':
          description: Product not found
        '409':
          description: Out of stock conflict
        '422':
          description: Validation error
  /api/v1/orders:
    get:
      summary: List orders with eager-loaded order items and products
      operationId: orders.list_orders
      responses:
        '200':
          description: List of orders
    post:
      summary: Create an order with multiple OrderItem entries
      operationId: orders.create_order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIn'
      responses:
        '201':
          description: Order created
        '404':
          description: Referenced product not found
        '409':
          description: Insufficient product stock
        '422':
          description: Validation error
  /api/v1/orders/{id}:
    get:
      summary: Retrieve a single order with eager-loaded items and products
      operationId: orders.get_order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details
        '404':
          description: Order not found
components:
  schemas:
    ProductIn:
      type: object
      required: [sku, name, price_cents]
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
          nullable: true
        price_cents:
          type: integer
          minimum: 0
        qty_in_stock:
          type: integer
          minimum: 0
          default: 0
    ProductPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
          nullable: true
        price_cents:
          type: integer
          minimum: 0
        qty_in_stock:
          type: integer
          minimum: 0
    ReserveIn:
      type: object
      required: [qty]
      properties:
        qty:
          type: integer
          minimum: 1
    OrderItemIn:
      type: object
      required: [product_id, qty]
      properties:
        product_id:
          type: integer
          minimum: 1
        qty:
          type: integer
          minimum: 1
    OrderIn:
      type: object
      required: [customer_name, items]
      properties:
        customer_name:
          type: string
          minLength: 1
          maxLength: 255
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemIn'
